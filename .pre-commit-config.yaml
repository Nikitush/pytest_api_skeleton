fail_fast: false
default_language_version:
  python: python3.10
repos:
- repo: https://github.com/psf/black
  rev: "23.3.0"
  hooks:
  - id: black
    args: ["--config=pyproject.toml"]

- repo: https://github.com/pycqa/flake8
  rev: "6.0.0"
  hooks:
  - id: flake8
    args: ["--config=.flake8"]

- repo: https://github.com/timothycrosley/isort
  rev: "5.12.0"
  hooks:
  - id: isort
    args: ["--settings-path=pyproject.toml"]
